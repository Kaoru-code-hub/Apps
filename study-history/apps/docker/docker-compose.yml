services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: study-history-app
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
